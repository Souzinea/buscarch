<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>buscarch</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: identidad buscarch. Un haz de luz mostaza sale de la lupa y cae sobre el app; bandas a todo el ancho, columna de 1120px. */
:root{
  --bg:#F5F1E6; --surface:#FFFFFF; --ink:#1F1F1F; --muted:#5E5A52; --line:#DDD8CB;
  --mustard:#E6B21E; --mustard-soft:#F6E3A6; --on-mustard:#1F1F1F; --gray:#D6D6D6;
  --band:#1F1F1F; --on-band:#F5F1E6;
  --f-display:"Montserrat",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#171717; --surface:#222222; --ink:#F5F1E6; --muted:#B4AE9F; --line:#343230;
  --mustard:#E6B21E; --mustard-soft:#3A3120; --on-mustard:#1F1F1F; --gray:#3A3A3A;
  --band:#0F0F0F; --on-band:#F5F1E6; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#171717; --surface:#222222; --ink:#F5F1E6; --muted:#B4AE9F; --line:#343230;
  --mustard:#E6B21E; --mustard-soft:#3A3120; --on-mustard:#1F1F1F; --gray:#3A3A3A;
  --band:#0F0F0F; --on-band:#F5F1E6; color-scheme:dark}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);font-weight:800;line-height:1.1;letter-spacing:-.02em;text-wrap:balance;margin:0}
h2{font-size:clamp(1.8rem,4vw,2.7rem)}
h3{font-size:1.15rem;font-weight:700;letter-spacing:-.01em}
p{margin:0}
.label{font-family:var(--f-display);font-weight:700;font-size:.72rem;letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}
a{color:inherit}
:focus-visible{outline:3px solid var(--mustard);outline-offset:3px}
.mark{background:var(--mustard);color:#1F1F1F;padding-inline:.12em;border-radius:4px;box-decoration-break:clone;-webkit-box-decoration-break:clone}

/* logo */
.logo{display:flex;align-items:center;gap:8px;text-decoration:none;font-family:var(--f-display);font-weight:800;font-size:1.4rem;letter-spacing:-.03em;color:var(--ink)}
.logo svg{width:30px;height:30px;flex:none}

/* header */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:12px;flex-wrap:wrap}
nav.links{display:flex;gap:22px;font-size:.92rem;font-weight:500}
nav.links a{text-decoration:none;color:var(--muted)}
nav.links a:hover{color:var(--ink)}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px;background:var(--surface)}
.lang button{font:700 .74rem var(--f-display);letter-spacing:.08em;border:0;background:transparent;color:var(--muted);padding:6px 11px;border-radius:999px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
@media (max-width:760px){nav.links{display:none}}

/* hero */
.hero{position:relative;overflow:hidden;border-bottom:1px solid var(--line)}
.beam{position:absolute;inset:0;background:var(--mustard);clip-path:polygon(47% 58%,100% 0,100% 100%,62% 100%);pointer-events:none}
.hero .wrap{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:center;padding-block:64px 0}
.hero-copy{padding-bottom:64px;min-width:0}
.hero h1{font-size:clamp(2.6rem,6.2vw,4.6rem);margin-block:16px 20px}
.hero p.lead{font-size:1.1rem;color:var(--muted);max-width:46ch}
.cta{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px}
.btn{display:inline-flex;align-items:center;gap:8px;font:700 .95rem var(--f-display);padding:14px 22px;border-radius:999px;text-decoration:none;border:2px solid var(--ink);cursor:pointer;background:transparent;color:var(--ink)}
.btn.primary{background:var(--ink);color:var(--bg)}
.btn.yellow{background:var(--mustard);border-color:var(--mustard);color:var(--on-mustard)}
.hero-phones{position:relative;display:flex;justify-content:center;align-items:flex-end;gap:0;min-width:0;padding-top:12px}
.hero-phones .phone{width:230px;margin-bottom:-60px}
.hero-phones .phone + .phone{width:210px;margin-left:-40px;margin-bottom:-110px;transform:rotate(4deg)}
.lens{position:absolute;left:34%;top:52%;width:0;height:0}
@media (max-width:860px){
  .hero .wrap{grid-template-columns:1fr;padding-block:44px 0}
  .hero-copy{padding-bottom:8px}
  .beam{clip-path:polygon(0 80%,100% 62%,100% 100%,0 100%)}
  .hero-phones .phone{width:190px}.hero-phones .phone + .phone{width:170px}
}

/* phone frame */
.phone{width:200px;aspect-ratio:9/19.5;max-width:100%;border:6px solid #0B0B0B;border-radius:36px;background:#F5F1E6;overflow:hidden;display:grid;place-items:center;position:relative;box-shadow:0 0 0 1.5px #9A9A9A,0 0 0 3px #2A2A2A,0 22px 44px rgba(31,31,31,.22)}
.phone img{width:100%;height:100%;object-fit:cover;display:block}
.phone .screen{position:absolute;left:0;top:0;width:360px;height:780px;transform-origin:0 0;place-self:start}
.phone::after{content:"";position:absolute;inset:0;border-radius:30px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.06);pointer-events:none}
.phone span{font-size:.7rem;color:#5E5A52;text-align:center;padding:10px}
.phone img + span{display:none}

section{padding-block:88px;border-bottom:1px solid var(--line)}
.sec-head{display:grid;gap:14px;margin-bottom:44px;max-width:700px}
.sec-head p{color:var(--muted);font-size:1.05rem}

/* problem */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:28px}
.stat{display:grid;gap:8px;align-content:start;min-width:0}
.stat b{font-family:var(--f-display);font-weight:800;font-size:clamp(2.4rem,5vw,3.4rem);letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1}
.stat b::after{content:"";display:block;width:48px;height:6px;background:var(--mustard);margin-top:12px}
.stat span{color:var(--muted)}
.src{margin-top:24px;font-size:.82rem;color:var(--muted)}
@media (max-width:720px){.stats{grid-template-columns:1fr}}

/* project */
#proyecto{background:var(--band);color:var(--on-band);border-bottom:0}
#proyecto .label{color:var(--mustard)}
#proyecto .sec-head p{color:color-mix(in srgb,var(--on-band) 72%,transparent)}
.phases{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;list-style:none;margin:0;padding:0;counter-reset:ph}
.phases li{border:1px solid rgba(245,241,230,.18);border-radius:14px;padding:16px;display:grid;gap:4px;min-width:0}
.phases li::before{counter-increment:ph;content:"0" counter(ph);font-family:var(--f-display);font-weight:700;font-size:.78rem;opacity:.6}
.phases li b{font-family:var(--f-display);font-weight:700;font-size:1.05rem;overflow-wrap:anywhere}
.phases li small{font-family:var(--f-display);font-weight:700;font-size:.66rem;letter-spacing:.14em;text-transform:uppercase;min-height:1.2em}
.phases li.now{background:var(--mustard);border-color:var(--mustard);color:#1F1F1F}
.phases li.now::before{opacity:.7}
@media (max-width:760px){.phases{grid-template-columns:repeat(2,1fr)}}

/* flows */
.tabs{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:28px}
.tab{font:700 .98rem var(--f-display);padding:14px 20px;border-radius:16px;border:2px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;text-align:left}
.tab small{display:block;font:500 .8rem var(--f-body);color:var(--muted)}
.tab[aria-selected="true"]{border-color:var(--ink);background:var(--mustard);color:#1F1F1F}
.tab[aria-selected="true"] small{color:#3d3a33}
.flow{display:grid;counter-reset:step;list-style:none;margin:0;padding:0}
.flow li{display:grid;grid-template-columns:76px 1fr 190px;gap:24px;align-items:center;padding-block:26px;border-top:1px solid var(--line)}
.flow li::before{counter-increment:step;content:counter(step,decimal-leading-zero);font-family:var(--f-display);font-weight:800;font-size:2rem;color:var(--ink);letter-spacing:-.03em;line-height:1}
.flow li:nth-child(odd)::before{color:var(--mustard)}
.flow h3{margin-bottom:8px;font-size:1.3rem}
.flow p{color:var(--muted);max-width:56ch}
.flow-end{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:24px}
.flow-end p{font-family:var(--f-display);font-weight:700;font-size:1.1rem}
@media (max-width:640px){.flow li{grid-template-columns:48px 1fr;gap:14px}.flow li .phone{grid-column:2;width:170px}.flow li::before{font-size:1.5rem}}
.features{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:56px}
.feat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;display:grid;gap:8px;align-content:start;min-width:0}
.feat .ic{width:44px;height:44px;border-radius:50%;background:var(--mustard);color:#1F1F1F;display:grid;place-items:center}
.feat svg{width:22px;height:22px}
.feat p{color:var(--muted);font-size:.92rem}
@media (max-width:860px){.features{grid-template-columns:repeat(2,1fr)}}
@media (max-width:480px){.features{grid-template-columns:1fr}}

/* form */
#feedback{background:#F9B60A;color:#1F1F1F;border-bottom:0;position:relative;overflow:hidden;padding-bottom:120px}
#feedback > .wrap{position:relative;z-index:1}
/* escena: la casa sube y el sol baja hasta quedar detrás de ella */
.scene{position:absolute;left:0;bottom:0;width:min(58vw,880px);aspect-ratio:1132/716;z-index:0;pointer-events:none}
.scene .sun{position:absolute;left:7.8%;top:-26%;width:55.8%;aspect-ratio:1;border-radius:50%;background:#E09701}
.scene .house{position:absolute;inset:auto 0 0 0;width:100%;height:auto;display:block}
@media (prefers-reduced-motion:no-preference){
  .scene .house{transition:transform 1.2s cubic-bezier(.2,.75,.2,1)}
  .scene .sun{transition:transform 1.5s cubic-bezier(.25,.8,.25,1) .15s}
  .js-anim .scene.reveal.pre{opacity:1;transform:none}
  .js-anim .scene.pre .house{transform:translateY(105%)}
  .js-anim .scene.pre .sun{transform:translateY(-190%)}
}
@media (max-width:860px){
  #feedback{padding-bottom:calc(min(100vw,560px) * .632 + 40px)}
  .scene{width:min(100vw,560px)}
}
#feedback .label{color:#1F1F1F;opacity:.7}
#feedback .sec-head p{color:#3d3a33}
form{background:var(--surface);color:var(--ink);border-radius:20px;padding:clamp(20px,4vw,40px);display:grid;gap:28px;max-width:780px;box-shadow:0 20px 50px rgba(31,31,31,.15)}
fieldset{border:0;margin:0;padding:0;display:grid;gap:10px;min-width:0}
legend{font-family:var(--f-display);font-weight:700;margin-bottom:10px;padding:0}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{position:relative}
.opt input{position:absolute;opacity:0;inset:0;cursor:pointer}
.opt span{display:inline-block;padding:10px 16px;border:1.5px solid var(--line);border-radius:999px;font-size:.92rem;background:var(--bg)}
.opt input:checked + span{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.opt input:focus-visible + span{outline:3px solid var(--mustard);outline-offset:2px}
.scale .opt span{width:50px;text-align:center;padding-inline:0;font-family:var(--f-display);font-weight:700}
.scale .opt input:checked + span{background:var(--mustard);border-color:var(--mustard);color:#1F1F1F}
.scale-ends{display:flex;justify-content:space-between;max-width:290px;font-size:.78rem;color:var(--muted)}
label.field{display:grid;gap:8px;font-family:var(--f-display);font-weight:700}
input[type=text],textarea{font:400 1rem var(--f-body);color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:12px;width:100%}
textarea{min-height:110px;resize:vertical}
.hint{font:400 .85rem var(--f-body);color:var(--muted)}
.err{color:#B3261E;font-size:.9rem;min-height:1.2em;font-weight:600}
.thanks{display:grid;gap:10px;max-width:780px;background:var(--surface);color:var(--ink);border-radius:20px;padding:40px}

/* fotos de la identidad */
.split{display:grid;grid-template-columns:1.2fr .8fr;gap:48px;align-items:center;margin-bottom:44px}
.split .sec-head{margin-bottom:0}
.photo{margin:0;border-radius:24px;overflow:hidden;background:transparent}
.photo img{display:block;width:100%;height:auto}
.form-grid{display:grid;grid-template-columns:.8fr 1.2fr;gap:48px;align-items:start}
.form-side{display:grid;gap:28px;position:sticky;top:96px;min-width:0}
.form-side .sec-head{margin-bottom:0}
.form-main{min-width:0}
@media (max-width:860px){
  .split,.form-grid{grid-template-columns:1fr;gap:28px}
  .split .photo{max-width:420px}
  .form-side{position:static}
  .form-side .photo{display:none}
}

/* animaciones al hacer scroll: solo se ocultan los elementos que todavía no se ven al cargar */
@media (prefers-reduced-motion:no-preference){
  .js-anim .reveal.pre,.js-anim .reveal-group.pre > *{opacity:0;transform:translateY(28px)}
  .reveal,.reveal-group > *{transition:opacity .7s cubic-bezier(.2,.7,.2,1),transform .7s cubic-bezier(.2,.7,.2,1)}
  .reveal-group > *:nth-child(2){transition-delay:.08s}
  .reveal-group > *:nth-child(3){transition-delay:.16s}
  .reveal-group > *:nth-child(4){transition-delay:.24s}
  .reveal-group > *:nth-child(5){transition-delay:.32s}
  .flow li.reveal .phone{transition:transform .9s cubic-bezier(.2,.7,.2,1) .1s}
  .js-anim .flow li.reveal.pre .phone{transform:translateY(40px) rotate(3deg)}
  .photo.reveal img{transition:transform 1.2s cubic-bezier(.2,.7,.2,1)}
  .js-anim .photo.reveal.pre img{transform:scale(1.08)}
  .js-anim .photo.reveal.pre{opacity:0;transform:translateY(28px)}
  /* entrada del hero: el haz de luz se abre y los celulares suben */
  .beam{animation:beam 1.1s cubic-bezier(.2,.7,.2,1) both}
  @keyframes beam{from{clip-path:polygon(47% 58%,47% 58%,47% 58%,47% 58%)}}
  .hero-phones .phone{animation:rise .9s cubic-bezier(.2,.7,.2,1) .35s both}
  .hero-phones .phone + .phone{animation-name:rise2;animation-delay:.5s}
  @keyframes rise{from{opacity:0;transform:translateY(60px)}}
  @keyframes rise2{from{opacity:0;transform:translateY(80px) rotate(10deg)}to{transform:rotate(4deg)}}
  .hero-copy > *{animation:fadeup .8s cubic-bezier(.2,.7,.2,1) both}
  .hero-copy > *:nth-child(2){animation-delay:.08s}.hero-copy > *:nth-child(3){animation-delay:.16s}.hero-copy > *:nth-child(4){animation-delay:.24s}
  @keyframes fadeup{from{opacity:0;transform:translateY(18px)}}
}
@media (max-width:860px) and (prefers-reduced-motion:no-preference){
  @keyframes beam{from{clip-path:polygon(0 100%,100% 100%,100% 100%,0 100%)}}
}

/* del boceto en papel al app */
.shots{position:relative;width:270px;display:flex;justify-content:flex-end}
.shots .phone{width:190px}
.sketch{position:absolute;left:0;bottom:-6px;width:104px;margin:0;transform:rotate(-7deg);z-index:1;display:grid;gap:4px;justify-items:center}
.sketch img{width:100%;height:auto;display:block;filter:drop-shadow(0 8px 14px rgba(31,31,31,.18))}
.sketch figcaption{font:700 .62rem var(--f-display);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);background:var(--bg);padding:2px 6px;border-radius:4px;white-space:nowrap}
.sketch-note{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:.92rem;margin:-8px 0 20px}
.sketch-note img{width:22px;height:auto}
@media (prefers-reduced-motion:no-preference){
  .flow li.reveal .sketch{transition:transform .9s cubic-bezier(.2,.7,.2,1) .2s,opacity .6s .2s}
  .js-anim .flow li.reveal.pre .sketch{transform:translateX(30px) rotate(0deg);opacity:0}
}
footer{background:var(--band);color:var(--on-band);padding-block:40px;font-size:.85rem}
footer .wrap{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
footer .logo{color:var(--on-band);font-size:1.2rem}
footer .tag{opacity:.7}
</style>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="logo" viewBox="0 0 40 40">
    <circle cx="23" cy="17" r="13" fill="none" stroke="currentColor" stroke-width="4.2"/>
    <path d="M13.6 26.4 4 36" stroke="currentColor" stroke-width="5.2" stroke-linecap="round"/>
    <path d="M16.5 25V17.2l6.8-5.2 6.2 4.4V25z" fill="currentColor"/>
    <path d="M23.3 12v13" style="stroke:var(--logo-gap,var(--bg))" stroke-width="1.4"/>
  </symbol>
</svg>

<header>
  <div class="wrap bar">
    <a class="logo" href="#top"><svg aria-hidden="true"><use href="#logo"/></svg><span class="brand"></span></a>
    <nav class="links">
      <a href="#proyecto" data-i18n="nav_team"></a>
      <a href="#como" data-i18n="nav_how"></a>
      <a href="#feedback" data-i18n="nav_form"></a>
    </nav>
    <div class="lang" role="group" aria-label="Idioma / Langue / Language">
      <button type="button" data-lang="es">ES</button>
      <button type="button" data-lang="pt">PT</button>
      <button type="button" data-lang="fr">FR</button>
      <button type="button" data-lang="en">EN</button>
    </div>
  </div>
</header>

<main id="top">
  <div class="hero">
    <div class="beam"></div>
    <div class="wrap">
      <div class="hero-copy">
        <p class="label" data-i18n="hero_label"></p>
        <h1 data-i18n-html="hero_title"></h1>
        <p class="lead" data-i18n="hero_lead"></p>
        <div class="cta">
          <a class="btn primary" href="#como" data-i18n="hero_cta1"></a>
          <a class="btn" href="#feedback" data-i18n="hero_cta2"></a>
        </div>
      </div>
      <div class="hero-phones">
        <div class="phone"><div class="screen" data-shot="cliente-1"></div></div>
        <div class="phone"><div class="screen" data-shot="cliente-3"></div></div>
      </div>
    </div>
  </div>

  <section id="problema">
    <div class="wrap">
      <div class="split">
        <div class="sec-head reveal">
          <p class="label" data-i18n="prob_label"></p>
          <h2 data-i18n="prob_title"></h2>

(function(){

  var io=new IntersectionObserver(function(entries){entries.forEach(function(e){

        nums.forEach(function(b,i){var f=finals[i], v=parseFloat(f.replace(",",".")), dec=f.indexOf(",")>-1?1:0;
          b.textContent=(v*ease).toFixed(dec).replace(".",",")+"%";});
        if(k<1) requestAnimationFrame(step); else nums.forEach(function(b,i){b.textContent=finals[i];});}
      requestAnimationFrame(step);
    };
    var shown=false;
    var so=new IntersectionObserver(function(en){
      if(en[0].intersectionRatio>=0.4){ if(!shown){shown=true;run();} }
      else if(!en[0].isIntersecting){ shown=false; }
    },{threshold:[0,0.4]});
    so.observe(stats);
  }
})();

/* tabs */
var tabs=[["tab-c","flow-c"],["tab-p","flow-p"]];
tabs.forEach(function(p){document.getElementById(p[0]).addEventListener("click",function(){
  tabs.forEach(function(q){var on=q[0]===p[0];document.getElementById(q[0]).setAttribute("aria-selected",on);document.getElementById(q[1]).hidden=!on;});
  [].forEach.call(document.querySelectorAll("#"+p[1]+" .reveal.pre"),function(el){var r=el.getBoundingClientRect(); if(r.top<(window.innerHeight||800)) el.classList.remove("pre");});
});});

/* form */
var form=document.getElementById("fb");
form.addEventListener("submit",function(e){
  e.preventDefault();
  var err=document.getElementById("err"), d=T[lang], fd=new FormData(form);
  if(!fd.get("nota")||!fd.get("usaria")||!fd.get("rol")){err.textContent=d.err_req;return;}
  err.textContent="";
  function done(demo){form.hidden=true;document.getElementById("thanks").hidden=false;document.getElementById("demo-note").hidden=!demo;}
  if(!GF.entries.nota){done(true);return;}
  var M={usaria:{si:"Sim",tal_vez:"Talvez",no:"Não"},
    rol:{contratante:"Cliente particular",empresa:"Empresa contratante",profesional:"Arquiteto ou profissional",ambos:"Das duas formas"},
    funcion:{mapa:"Mapa",comparacion:"Comparador",chat:"Chat",ia:"Assistente IA"}};
  var E=GF.entries, body=new URLSearchParams();
  body.append(E.nota,fd.get("nota"));
  body.append(E.usaria,M.usaria[fd.get("usaria")]);
  body.append(E.rol,M.rol[fd.get("rol")]);
  fd.getAll("funcion").forEach(function(v){body.append(E.funcion,M.funcion[v]);});
  var op=(fd.get("opinion")||"").trim();
  body.append(E.opinion, op ? "["+lang.toUpperCase()+"] "+op : "");
  body.append(E.nombre,(fd.get("nombre")||"").trim());
  var btn=document.getElementById("send"); btn.disabled=true; btn.textContent=d.sending;
  fetch("https://docs.google.com/forms/d/e/"+GF.id+"/formResponse",{method:"POST",mode:"no-cors",body:body})
    .then(function(){done(false);})
    .catch(function(){err.textContent=d.err_net;})
    .then(function(){btn.disabled=false;btn.textContent=T[lang].send;});
});
</script>
